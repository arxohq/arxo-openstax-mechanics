<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="350" viewBox="0 0 1230 350" role="img"><title>editions</title><rect width="1230" height="350" rx="20" fill="#f5f0e5"/><g font-family="Arial, Helvetica, sans-serif" fill="#15263d"><text x="34" y="45" font-size="18" fill="#246c65">THE SAME FACTS, A DIFFERENT SOURCE EDITION</text><text x="34" y="84" font-size="19" fill="#15263d">Collision: objects stick together and move with the same velocity.</text><rect x="34" y="112" width="550" height="156" rx="12" fill="white"/><text x="56" y="148" font-size="22" fill="#15263d">2026-04-01 · before erratum</text><text x="56" y="196" font-size="30" fill="#246c65">NEITHER</text><text x="56" y="237" font-size="16" fill="#15263d">The selected definition does not establish the claim.</text><rect x="634" y="112" width="550" height="156" rx="12" fill="white"/><text x="656" y="148" font-size="22" fill="#15263d">2026-05-01 · after erratum</text><text x="656" y="196" font-size="30" fill="#246c65">TRUE_ONLY</text><text x="656" y="237" font-size="16" fill="#15263d">The selected definition establishes the claim.</text><text x="34" y="308" font-size="17" fill="#15263d">Both evaluations are COMPUTED. NEITHER is an unresolved proposition, not a false one.</text></g></svg>
