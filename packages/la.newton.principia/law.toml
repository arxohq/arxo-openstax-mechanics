# Манифест §10 — маркер корня пакета (DECISION-0033). Нормативны заголовки §22
# в самих .law; манифест обязан с ними совпадать (LDC-E1109, lawc check).
#
# ПЕРВЫЙ АКТ ИСТОРИИ НАУКИ В КОРПУСЕ. Формализуется аксиоматический каркас
# первого издания «Principia» (1687): определения, три закона движения,
# короллярии и обе схолии — как система правил над «частями» (partes) самого
# текста. Вопрос, на который пакет отвечает: не «что думал Ньютон», а «что
# ЭТА система заключила бы из данного набора наблюдений». Непрерывная
# динамика (книги I–III: флюксии, орбиты) вне вычислимой поверхности
# принципиально и в охват не входит; геометрия направлений (параллелограмм
# сил) — объявленная граница единиц 13–14.
[package]
name = "la.newton.principia"
version = "0.1.0"
language = "0.2"
namespace = "urn:la:newton:clir:principia"

# Каталожная метадата (DECISION-0051; docs/PACKAGE-METADATA.ru.md). НЕ семантика:
# в CLIR не понижается, в semantic hash §209 не входит. Выводимые поля
# сверяются с source-декларациями воротами check_package_metadata.py.
[metadata]
act = "la-principia-1687"
title = "Principia 1687: определения и законы движения Ньютона — аксиоматический каркас как исполняемая система правил"
primarySource = "PRINCIPIA"

# Выводимые. Совпадение с sources.law держат ворота, а не эти строки.
jurisdiction = "none"
instrument = "treatise"
sourceFidelity = "pinned_unofficial_copy"

# Невыводимые — не сверяет никто, поэтому у каждого записана причина.
#
# issuer: автор первоиздания назван на титуле и известен достоверно —
# в отличие от евклидовой традиции текстологического вопроса здесь нет;
# лицензию на печать дал Питс (imprimatur S. Pepys, Reg. Soc. Praeses),
# но издателем СОЧИНЕНИЯ он не является.
issuer = "Isaac Newton (editio princeps, Londini, 1687)"
# legalStatus: doctrine — сочинение никем не введено в действие и не
# отменено; оно нормативно так, как нормативна теория: силой вывода из
# принятых аксиом. Дорелятивистская механика опровергнута опытом в
# пограничных режимах, но КАК СИСТЕМА ВЫВОДА не перестала существовать —
# ровно это пакет и формализует.
legalStatus = "doctrine"
# verifiedAgainstSource: транскрипция Викитеки постранично привязана к
# факсимиле первого издания (Index:Principia newton la.djvu, pagequality
# 3–4), и каждая страница закреплённых байтов проверяема против своего
# изображения; независимого второго НАБОРА того же издания не сверялось —
# третье издание (1726) есть другая редакция с другим текстом законов.
verifiedAgainstSource = true

# Рукописные сценарии пакета: исполняются общим раннером,
# в учёт покрытия регрессии не входят.
[[tests]]
family = "la.newton.principia#authored"
regression = false
suites = ["tests/01-aer-quadruplus.lawtest", "tests/02-lex-prima-perseverat.lawtest", "tests/03-lex-prima-cogitur.lawtest", "tests/04-summa-sexdecim.lawtest", "tests/05-vitrea-quindecim.lawtest"]
world = ["la.newton.principia"]

# Сценарии пакета: единственный источник фактов, вопросов и ожиданий.
[[tests]]
family = "principia"
suites = ["tests/principia.lawtest"]
world = ["la.newton.principia"]
