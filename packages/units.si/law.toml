# Манифест §10 — маркер корня пакета (DECISION-0033). Заголовки §22 в самих
# `.law` обязаны совпадать с этим именем (LDC-E1109, lawc check).
#
# ПАКЕТ ЕДИНИЦ (DECISION-0154, §49.2): нормативного источника у него нет,
# юрисдикции нет, правового статуса нет — у метра их не бывает. Каталожная
# секция `[metadata]` DECISION-0051 описывает АКТ и здесь намеренно
# отсутствует, ровно как у вычислительных пакетов `calc.*` (DECISION-0123):
# подставить `jurisdiction`/`legalStatus` значило бы объявить определения
# единиц нормативным актом. Ворота `check_package_metadata.py` читают только
# `corpus/laws/`, поэтому отсутствие секции их не касается.
[package]
name = "units.si"
version = "0.1.0"
language = "0.2"
namespace = "urn:law:units:si"

# Вход ПАКЕТА, а не арифметической операции (рамка 3 DECISION-0068 в редакции
# E-0068). Тот же флаг стоит у КАЖДОГО объявления в порождённом `si.law`:
# отозвав его в реестре `spec/feature-registry.json`, пакет обязан покраснеть,
# а не остаться молча объявленным.
[features]
enabled = ["law.units/0.1"]
semanticLayer = "L0"

[authoring]
local_imports = "explicit"
